services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: productos
      POSTGRES_PASSWORD: productos
      POSTGRES_DB: productos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: productos
      MINIO_ROOT_PASSWORD: productosdev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://productos:productos@db:5432/productos?schema=public
      AUTH_SECRET: change-me-in-production
      NEXTAUTH_URL: http://localhost:3000
      ALLOW_DEV_LOGIN: "true"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: productos
      S3_ACCESS_KEY_ID: productos
      S3_SECRET_ACCESS_KEY: productosdev
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
