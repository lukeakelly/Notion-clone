name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://productos:productos@localhost:5432/productos?schema=public
      AUTH_SECRET: test-secret-32-bytes-minimum-xxxxxxxxxxxx
      ALLOW_DEV_LOGIN: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: productos
          POSTGRES_PASSWORD: productos
          POSTGRES_DB: productos
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U productos"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
